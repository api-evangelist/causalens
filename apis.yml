apis:
- name: Dara Application Framework HTTP API
  description: 'The HTTP surface exposed by a Dara application. Dara is causaLens''
    Apache-2.0 open-source Python framework built on FastAPI; each app serves a documented
    set of built-in routes (session verification, token refresh, file upload) and lets
    developers register custom REST endpoints with the dara.core.http get/post/put/patch/delete
    decorators. Dara applications are self-hosted, so there is no single vendor-operated
    base URL — the base URL is whatever host the operator deploys the app to.'
  humanURL: https://dara.causalens.com/docs/generated/dara/docs/advanced/custom-endpoints
  x-deployment: self-hosted
  x-base-url-note: 'Self-hosted framework — no vendor-operated production host exists.
    No baseURL is recorded rather than fabricate one; api.causalens.com does not resolve.'
