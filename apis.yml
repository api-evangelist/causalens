aid: causalens
name: CausaLens
description: 'causaLens is a London-headquartered enterprise AI company and a pioneer
  of Causal AI — machine intelligence that models cause-and-effect relationships rather
  than correlation alone. Its commercial platform, decisionOS, is a decision-making
  operating system that combines causal discovery, causal graph modelling, and multi-agent
  "Digital Knowledge Workers" that automate repetitive data-science and analyst workflows
  for enterprises. The platform is delivered as a hosted product plus a Python-first
  interface, and is distributed through the Microsoft Azure Marketplace and the UK
  G-Cloud Digital Marketplace. causaLens also maintains Dara, an Apache-2.0 open-source
  Python application framework for building interactive, decision-support web apps,
  published on GitHub with packages on PyPI and npm and full public documentation.'
